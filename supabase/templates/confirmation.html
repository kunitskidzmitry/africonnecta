<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f8fafc;
      font-family:
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #0f172a;
    "
  >
    <!--
      Ссылка собирается из RedirectTo, а не из ConfirmationURL: нам нужен token_hash,
      проверяемый на сервере, чтобы письмо открывалось на любом устройстве.

      RedirectTo уже содержит параметр next, поэтому дальше идёт «&», а не «?».
      Значение RedirectTo обязано попадать в additional_redirect_urls, иначе Supabase
      подставит site_url — это защита от подмены адреса и угона кода подтверждения.

      Тело письма не содержит персональных данных, кроме адреса получателя: почта —
      незашифрованный канал (§9, «утечка через уведомления»).
    -->
    <table role="presentation" style="max-width: 520px; margin: 0 auto">
      <tr>
        <td style="background: #ffffff; border-radius: 12px; padding: 32px">
          <h1 style="margin: 0 0 16px; font-size: 20px">Confirm your email</h1>

          <p style="margin: 0 0 24px; line-height: 1.6; color: #475569">
            You are one click away from your AfriConnecta account. This link is valid for one hour
            and can be used once.
          </p>

          <p style="margin: 0 0 24px">
            <a
              href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=signup"
              style="
                display: inline-block;
                background: #0f172a;
                color: #ffffff;
                text-decoration: none;
                padding: 12px 20px;
                border-radius: 8px;
                font-weight: 600;
              "
              >Confirm email address</a
            >
          </p>

          <p style="margin: 0; line-height: 1.6; color: #94a3b8; font-size: 13px">
            If you did not create this account, ignore this message and nothing will happen.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
