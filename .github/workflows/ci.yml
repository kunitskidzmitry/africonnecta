name: CI

on:
  push:
    branches: [main]
  pull_request:

# Красный CI блокирует мерж. Для соло-разработчика это замена ревьюеру,
# см. §2.2.1 docs/implementation-prompt.md.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Утечка service-role-ключа в клиентский бандл = полный доступ к базе
      # в обход RLS. Проверяем механически, см. §2.2.1.
      - name: Assert no service-role key in client bundle
        run: |
          if grep -rlE 'SUPABASE_SERVICE_ROLE|service_role' .next/static 2>/dev/null; then
            echo "::error::Service-role credentials found in the client bundle"
            exit 1
          fi
          echo "Client bundle is clean"

  # Отдельная работа: поднимает настоящий Supabase в Docker и прогоняет регистрацию
  # целиком, вместе с письмом подтверждения. Стоит несколько минут, поэтому вынесена
  # из быстрых проверок и идёт параллельно с ними.
  #
  # Смысл именно в живом стеке: триггеры базы, шаблон письма и настройки auth не
  # покрываются никакими модульными тестами, а ломаются в первую очередь.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start Supabase
        run: npm run db:start

      - name: Run integration tests
        run: npm run test:integration

      - name: Stop Supabase
        if: always()
        run: npm run db:stop
